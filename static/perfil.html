<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil | Folha de Estudo</title>
    <meta name="description" content="Perfil da plataforma Folha de Estudo." />
    <link rel="stylesheet" href="/styles.css?v=73" />
  </head>
  <body>
    <main class="appFrame profilePage">
      <header class="appHeader">
        <a class="logoText" href="/dashboard.html">Folha de Estudo</a>
        <div class="headerSpacer"></div>
        <a class="savedHeaderLink" href="/salvos.html">Arquivos salvos</a>
        <a class="createButton" href="/">Criar PDF</a>
        <a class="avatarLink" href="/perfil.html" aria-label="Perfil">PC</a>
      </header>

      <section class="profileCard">
        <label class="profileAvatarPicker">
          <input id="profilePhoto" type="file" accept="image/*" />
          <span class="profileAvatar">PC</span>
          <strong>Alterar foto</strong>
        </label>
        <div>
          <p class="sectionTag">Perfil</p>
          <h1>Meu Perfil</h1>
          <p>Informações básicas da conta usada pela equipe.</p>
        </div>
        <label>
          <span>Nome</span>
          <input id="profileName" type="text" value="PAZ Church Barueri" />
        </label>
        <label>
          <span>E-mail</span>
          <input id="profileEmail" type="email" value="equipe@pazchurch.com" />
        </label>
        <p id="profileStatus" class="authStatus srOnly" aria-live="polite"></p>
        <div class="profileActions">
          <button id="saveProfile" class="download" type="button">Salvar alterações</button>
          <button id="logoutProfile" class="secondaryAction" type="button">Sair da conta</button>
        </div>
      </section>

      <div id="cropModal" class="modalOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="cropModalTitle">
        <section class="confirmModal cropModal">
          <div class="modalText">
            <h2 id="cropModalTitle">Ajustar foto de perfil</h2>
            <p>Arraste a imagem e use o zoom para centralizar o rosto.</p>
          </div>
          <div class="cropFrame" id="cropFrame">
            <img id="cropImage" alt="" />
          </div>
          <label class="cropZoom">
            <span>Zoom</span>
            <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" />
          </label>
          <div class="modalActions">
            <button id="cancelCrop" class="modalCancel" type="button">Cancelar</button>
            <button id="applyCrop" class="download" type="button">Usar foto</button>
          </div>
        </section>
      </div>

      <div id="profileToast" class="toast profileToast hidden" role="status" aria-live="polite">
        <span class="toastIcon" aria-hidden="true">✓</span>
        <span class="toastText">
          <strong id="profileToastTitle">Alteração salva</strong>
          <small id="profileToastMessage">Seu perfil foi atualizado com sucesso.</small>
        </span>
        <button id="closeProfileToast" type="button" aria-label="Fechar">×</button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/supabase-client.js?v=3"></script>
    <script src="/perfil.js?v=4"></script>
  </body>
</html>
