<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Conta | Folha de Estudo</title>
    <meta name="description" content="Crie sua conta na plataforma Folha de Estudo." />
    <link rel="stylesheet" href="/styles.css?v=65" />
  </head>
  <body>
    <main class="authPage">
      <form class="authCard" action="/dashboard.html">
        <div class="authBrand">
          <strong>Folha de Estudo</strong>
          <span>PAZ Church Barueri</span>
        </div>

        <div class="authHeading">
          <h1>Criar sua conta</h1>
          <p>Crie uma conta para começar a gerar folhas de estudo.</p>
        </div>

        <label class="authField">
          <span>Nome completo</span>
          <input type="text" placeholder="Nome Completo" autocomplete="name" />
        </label>

        <label class="authField">
          <span>E-mail</span>
          <input type="email" placeholder="voce@pazchurch.com" autocomplete="email" />
        </label>

        <label class="authField">
          <span>Senha</span>
          <input type="password" placeholder="Crie uma senha" autocomplete="new-password" />
        </label>

        <label class="authField">
          <span>Confirmar senha</span>
          <input type="password" placeholder="Repita a senha" autocomplete="new-password" />
        </label>

        <button class="authPrimary" type="submit">Criar conta</button>

        <div class="authDivider"><span></span><small>ou</small><span></span></div>

        <button class="authGoogle" type="button">
          <span aria-hidden="true"></span>
          Cadastrar com Google
        </button>

        <p class="authSwitch">Já tem conta? <a href="/login.html">Entrar</a></p>
      </form>
    </main>
  </body>
</html>
