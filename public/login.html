<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Folha de Estudo</title>
    <meta name="description" content="Entre na plataforma Folha de Estudo." />
    <link rel="stylesheet" href="/styles.css?v=66" />
  </head>
  <body data-auth-mode="login">
    <main class="authPage">
      <form id="authForm" class="authCard authCardLogin">
        <div class="authBrand">
          <strong>Folha de Estudo</strong>
          <span>PAZ Church Barueri</span>
        </div>

        <div class="authHeading">
          <h1>Entrar na conta</h1>
          <p>Acesse sua conta para gerar e revisar folhas de estudo.</p>
        </div>

        <label class="authField">
          <span>E-mail</span>
          <input id="authEmail" type="email" placeholder="voce@pazchurch.com" autocomplete="email" />
        </label>

        <label class="authField">
          <span>Senha</span>
          <input id="authPassword" type="password" placeholder="Sua senha" autocomplete="current-password" />
        </label>

        <p id="authStatus" class="authStatus" aria-live="polite"></p>

        <button id="authSubmit" class="authPrimary" type="submit">Entrar</button>

        <div class="authDivider"><span></span><small>ou</small><span></span></div>

        <button id="googleAuth" class="authGoogle" type="button">
          <span class="googleIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" />
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z" />
            </svg>
          </span>
          Entrar com Google
        </button>

        <p class="authSwitch">Ainda não tem conta? <a href="/criar-conta.html">Criar conta</a></p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/supabase-client.js?v=2"></script>
    <script src="/auth.js?v=1"></script>
  </body>
</html>
